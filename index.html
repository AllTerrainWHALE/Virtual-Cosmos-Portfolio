<!doctype html>
<html lang="en">
  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link href='https://fonts.googleapis.com/css?family=Open+Sans' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Oswald' rel='stylesheet' type='text/css'>

    <link rel="stylesheet" href="css/bootstrap/bootstrap.css">

    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"> -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

    <script src="https://kit.fontawesome.com/6ac3910c4e.js" crossorigin="anonymous"></script>
    <script src="js/bootstrap/bootstrap.js"></script>

    <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/106/three.min.js'></script>
    <script src='https://s3-us-west-2.amazonaws.com/s.cdpn.io/2666677/OrbitControls.js'></script>
    <script src='https://s3-us-west-2.amazonaws.com/s.cdpn.io/2666677/GLTFLoader.js'></script>

    <link rel="stylesheet" href="css/style.css">

    <title>Bradley Hopper - Software Engineer</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
  </head>

  <body style="height: 100%; overflow: hidden;">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-sm navbar-dark">
      <!-- Brand -->
      <a class="navbar-brand" href="#sun" style="padding-left:1rem"><h1>Bradley Hopper</h1></a>

      <!-- Collapsible Navbar Menu Icon -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <!-- Link Menu item button to the links class navbar-collapse selector -->
      <div class="collapse navbar-collapse" id="navbarCollapse">

        <!-- Links -->
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <a class="nav-link" href="#sun">Home</a>
          </li>
          <!-- <li class="nav-item">
            <a class="nav-link" href="html/about.html">About</a>
          </li> -->
  
          <!-- Dropdown -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbardrop" data-bs-toggle="dropdown">Planets</a>
            <div class="dropdown-menu">
              <a class="dropdown-item" href="#mercury">Mercury</a>
              <a class="dropdown-item" href="#venus">Venus</a>
              <a class="dropdown-item" href="#earth">Earth</a>
              <a class="dropdown-item" href="#mars">Mars</a>
            </div>
          </li>
        </ul>
      </div>
    </nav>
    
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-logo">Virtual Cosmos</div>
        <div class="loading-container">
            <div class="loading-bar" id="loading-bar"></div>
        </div>
        <div class="loading-text" id="loading-text">Loading assets: 0%</div>
        <div class="loading-details" id="loading-details"></div>
    </div>

    

    <div id="celestial-info" class="celestial-infobox">
      <h1 class="info-title"></h1>
      <h2 class="info-subtitle"></h2>
      <!-- <p class="info-description"></p> -->
      <span>Double click/tap to zoom in</span>
    </div>

    <div id="followed-info" class="celestial-infobox followed-infobox">
      <h1 class="info-title"></h1>
      <h2 class="info-subtitle"></h2>
      <p class="info-description"></p>
      <div class="info-links-container"></div>
      <!-- <span class="info-credit"></span> -->
      <!-- <a class="info-link" href="" target="_blank" rel="noopener noreferrer"><i class="fa fa-github"></i> Github</a> -->
      <div class="button-container space-between" style="right:0; padding:0 1rem">
        <div style="display:flex; gap:0.5rem">
          <button class="info-button">Animate</button>
          <button class="images-button visible">Images</button>
        </div>
        <button class="expand-button"><i class="fa-solid fa-angle-down"></i></button>
        <button class="back-button">Back</button>
      </div>
    </div>

    <div id="settings" class="settings-box">
      <h1 class="info-title">Settings</h1>
      <div class="settings-content">

        <div class="setting-group">
          <label>Ambient Light: <span id="ambient-value" class="setting-value">3</span></label>
          <input type="range" id="ambient-slider" class="setting-slider" min="0" max="10" step="0.1" value="0">
        </div>

        <div class="setting-group">
          <label>Sun Emission: <span id="point-value" class="setting-value">2</span></label>
          <input type="range" id="point-slider" class="setting-slider" min="0" max="10" step="0.1" value="0">
        </div>

        <div class="setting-group">
          <label>Wireframe: <input type="checkbox" id="wireframe-toggle" class="setting-value"></label>
        </div>

        <div class="setting-group">
          <label>Hitboxes: <input type="checkbox" id="hitbox-toggle" class="setting-value"></label>
        </div>

      </div>
    </div>
    <div id="settings-toggle" class="settings-toggle">
      <i class="fas fa-gear"></i>
    </div>

    <div id="versionTag">
      <span>BETA VERSION</span>
    </div>

    <div id="image-viewer" class="image-viewer">
      <span class="close">&times;</span>
      <img class="viewer-image" src="" alt="Project image">
      <div class="nav prev">&#10094;</div>
      <div class="nav next">&#10095;</div>
    </div>


    <script type="module" src="js/solarsys.js"></script>
  </body>
</html>
